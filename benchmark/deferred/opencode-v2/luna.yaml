# STAGED OpenCode V2 primary profile. Launch only after the per-model gate in
# benchmark/README.md; this remains outside the current primary batch.
job_name: opencode-v2-luna
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 14
retry:
  max_retries: 1
  # Retry transport/gateway faults only. Agent timeouts are a genuine efficiency
  # result on this task set, and verifier/reward failures are grading faults, so
  # re-running a whole trial for either would corrupt the measurement.
  exclude_exceptions:
    - AgentTimeoutError
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
    # An operator interrupt (Ctrl-C) surfaces as CancelledError. It is not a
    # transport fault, and retrying it relaunches every in-flight trial.
    - CancelledError
environment:
  type: docker
datasets:
- path: ../DeepSWE/tasks
  task_names:
  - expr-try-catch-errors
  - katex-multicolumn-array-spans
  - python-statemachine-state-data-scoping
  - oxvg-structural-selector-preservation
  - effect-sse-httpapi-streaming
  - scriggo-method-declarations
  - csstree-shorthand-expansion-compression
  - fastapi-implicit-head-options
  - boa-hierarchical-evaluation-cancellation
  - koota-composite-trait-aspects
agents:
- name: opencode-v2
  model_name: litellm/gpt-5.6-luna#max
  env:
    LITELLM_API_KEY: ${LITELLM_API_KEY}
    LITELLM_OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
  kwargs:
    version: "2.0.3"
    opencode_v2_checksums:
      linux-x64: 4b8c2cad67297c715adff18a569c8808b22fe23c7197fd1775bc11cbfa04022d
      linux-arm64: bc35547e678c68aaec1b2aa1623d1d77ec2585db6204574724826e40f20a7693
    restrict_model: true
    opencode_v2_config:
      update: disable
      share: disabled
      model: litellm/gpt-5.6-luna#max
      default_agent: build
      providers:
        litellm:
          canonical: openai
          name: LiteLLM
          env:
          - LITELLM_API_KEY
          # Built into the frozen 2.0.3 executable. The generic
          # openai-compatible Responses path does not exist in that release.
          package: '@opencode-ai/ai/providers/openai/responses'
          settings:
            baseURL: '{env:LITELLM_OPENAI_BASE_URL}'
          models:
            gpt-5.6-luna:
              modelID: gpt-5.6-luna
              name: GPT-5.6 Luna
              limit:
                context: 272000
                # PA1 intentionally uses the 272k Luna window. Reserve the
                # 128k output ceiling explicitly so the inherited canonical
                # 922k input limit cannot survive the config merge.
                input: 144000
                output: 128000
              body:
                max_output_tokens: 128000
              cost:
                input: 0.2
                output: 1.2
                cache:
                  read: 0.02
                  write: 0.25
              variants:
              - id: max
                settings:
                  reasoningEffort: max
      agents:
        build: {model: litellm/gpt-5.6-luna#max}
        plan: {model: litellm/gpt-5.6-luna#max}
        general: {model: litellm/gpt-5.6-luna#max}
        explore: {model: litellm/gpt-5.6-luna#max}
        title: {model: litellm/gpt-5.6-luna#max}
        summary: {model: litellm/gpt-5.6-luna#max}
        compaction: {model: litellm/gpt-5.6-luna#max}
