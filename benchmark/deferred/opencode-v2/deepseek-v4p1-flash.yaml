# STAGED OpenCode V2 primary profile. Launch only after the per-model gate in
# benchmark/README.md; this remains outside the current primary batch.
job_name: opencode-v2-deepseek-v4p1-flash
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 14
retry:
  max_retries: 1
  # Retry transport/gateway faults only. Agent timeouts are a genuine efficiency
  # result on this task set, and verifier/reward failures are grading faults, so
  # re-running a whole trial for either would corrupt the measurement.
  exclude_exceptions:
    - AgentTimeoutError
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
    # An operator interrupt (Ctrl-C) surfaces as CancelledError. It is not a
    # transport fault, and retrying it relaunches every in-flight trial.
    - CancelledError
environment:
  type: docker
datasets:
- path: ../DeepSWE/tasks
  task_names:
  - expr-try-catch-errors
  - katex-multicolumn-array-spans
  - python-statemachine-state-data-scoping
  - oxvg-structural-selector-preservation
  - effect-sse-httpapi-streaming
  - scriggo-method-declarations
  - csstree-shorthand-expansion-compression
  - fastapi-implicit-head-options
  - boa-hierarchical-evaluation-cancellation
  - koota-composite-trait-aspects
agents:
- name: opencode-v2
  model_name: deepseek/deepseek-v4p1-flash
  env:
    LITELLM_API_KEY: ${LITELLM_API_KEY}
    LITELLM_OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
  kwargs:
    variant: max
    version: "2.0.8"
    opencode_v2_checksums:
      linux-x64: 8390d897ce5cfcb08dff291558cd1ae5b09cb27e1d287aa1a5fcc96908cdf625
      linux-arm64: 957b1d890b2cde215f1d750885b23254e74014cc167a7b324a946fe73b7af0ce
    restrict_model: true
    model_catalog_file: benchmark/references/opencode-v2-model-catalog-2.0.8.json
    opencode_v2_config:
      update: disable
      share: disabled
      websearch: false
      providers:
        deepseek:
          env:
          - LITELLM_API_KEY
          package: 'aisdk:@ai-sdk/openai-compatible'
          settings:
            baseURL: '{env:LITELLM_OPENAI_BASE_URL}'
          # DeepSeek V4.1 Flash is absent from OpenCode 2.0.8's bundled
          # catalogue. This explicit profile follows the models.dev
          # fireworks-ai entry while modelID selects PA1's gateway alias.
          models:
            deepseek-v4p1-flash:
              modelID: deepseek-v4p1-flash
              name: DeepSeek V4.1 Flash
              family: deepseek-flash
              capabilities:
                tools: true
                input: [text, image]
                output: [text]
              limit:
                context: 1000000
                output: 384000
              body:
                max_tokens: 384000
              cost:
                input: 0.22
                output: 0.66
                cache:
                  read: 0.007
                  write: 0.0
              compatibility:
                maxTokensField: max_tokens
                reasoningField: reasoning_content
              variants:
              - id: low
                settings:
                  reasoningEffort: low
              - id: high
                settings:
                  reasoningEffort: high
              - id: max
                settings:
                  reasoningEffort: max
