# STAGED OpenCode V2 primary profile. Launch only after the per-model gate in
# benchmark/README.md; this remains outside the current primary batch.
job_name: opencode-v2-deepseek-v4p1-flash
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 14
retry:
  max_retries: 1
  # Retry transport/gateway faults only. Agent timeouts are a genuine efficiency
  # result on this task set, and verifier/reward failures are grading faults, so
  # re-running a whole trial for either would corrupt the measurement.
  exclude_exceptions:
    - AgentTimeoutError
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
    # An operator interrupt (Ctrl-C) surfaces as CancelledError. It is not a
    # transport fault, and retrying it relaunches every in-flight trial.
    - CancelledError
environment:
  type: docker
datasets:
- path: ../DeepSWE/tasks
  task_names:
  - expr-try-catch-errors
  - katex-multicolumn-array-spans
  - python-statemachine-state-data-scoping
  - oxvg-structural-selector-preservation
  - effect-sse-httpapi-streaming
  - scriggo-method-declarations
  - csstree-shorthand-expansion-compression
  - fastapi-implicit-head-options
  - boa-hierarchical-evaluation-cancellation
  - koota-composite-trait-aspects
agents:
- name: opencode-v2
  model_name: litellm/deepseek-v4p1-flash#max
  env:
    LITELLM_API_KEY: ${LITELLM_API_KEY}
    LITELLM_OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
  kwargs:
    version: "2.0.3"
    restrict_model: true
    opencode_v2_config:
      update: disable
      share: disabled
      model: litellm/deepseek-v4p1-flash#max
      default_agent: build
      providers:
        litellm:
          canonical: deepseek
          name: LiteLLM
          env:
          - LITELLM_API_KEY
          package: '@opencode-ai/ai/providers/openai-compatible/responses'
          settings:
            baseURL: '{env:LITELLM_OPENAI_BASE_URL}'
          models:
            deepseek-v4p1-flash:
              modelID: deepseek-v4p1-flash
              name: DeepSeek V4.1 Flash
              limit:
                # Match DeepSeek's documented 1M window and the upstream
                # OpenCode/models.dev DeepSeek profile used for this harness.
                context: 1000000
                output: 384000
              body:
                max_output_tokens: 384000
              cost:
                input: 0.15
                output: 0.60
                cache:
                  read: 0.003
                  write: 0.0
              variants:
              - id: max
                settings:
                  reasoningEffort: max
      agents:
        build: {model: litellm/deepseek-v4p1-flash#max}
        plan: {model: litellm/deepseek-v4p1-flash#max}
        general: {model: litellm/deepseek-v4p1-flash#max}
        explore: {model: litellm/deepseek-v4p1-flash#max}
        title: {model: litellm/deepseek-v4p1-flash#max}
        summary: {model: litellm/deepseek-v4p1-flash#max}
        compaction: {model: litellm/deepseek-v4p1-flash#max}
