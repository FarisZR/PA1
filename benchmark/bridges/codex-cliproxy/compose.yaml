name: pa1-codex-cliproxy

services:
  codex-cliproxy:
    # Pinned by tag *and* digest. The tag is only a label; the digest is what
    # actually runs, so this cannot drift between benchmark jobs.
    image: ghcr.io/fzr-forks/cliproxyapi:7.2.146-pa1-5659@sha256:26de0755cf37765291e149590e13ee354010c8caa7b25ec3981827f2d606d6dc
    pull_policy: missing
    restart: unless-stopped
    volumes:
      # CLIProxyAPI has no CA configuration key; Go uses the system trust store.
      # The runner already trusts the gateway's private PUKI roots, so reuse the
      # host bundle rather than carrying a second copy into the container. This
      # ships the public roots too, which the Anthropic route needs.
      - /etc/ssl/certs:/etc/ssl/certs:ro
      # Must be a generated file: CLIProxyAPI does no environment interpolation,
      # so the gateway and Anthropic credentials have to be literal here.
      - ../../generated/cliproxy-config.yaml:/CLIProxyAPI/config.yaml:ro
      # Only used when request-log is on; the live acceptance check reads it
      # from the host. prepare_configs.py creates it mode 0700.
      - ../../generated/cliproxy-logs:/CLIProxyAPI/logs
      # Persistent OpenAI OAuth state for the ChatGPT-backed Luna route.
      # The credential stays on the runner and is never mounted into Pier.
      - codex-cliproxy-auths:/root/.cli-proxy-api
    ports:
      # Must be port 80 (or 443). Pier's egress Squid permits plain HTTP only to
      # port 80 and CONNECT only to 443, so CLIProxyAPI's own 8317 is
      # unreachable from a trial container no matter what the allowlist says.
      #
      # The default bind is the Docker bridge gateway: every trial's egress
      # proxy container can reach it, and it is not published on the LAN.
      - "${CODEX_CLIPROXY_BIND:-172.17.0.1}:${CODEX_CLIPROXY_PORT:-80}:8317"
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c '</dev/tcp/127.0.0.1/8317'"
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  codex-cliproxy-auths:
