# Dedicated Codex Responses -> Anthropic Messages translator.
# This service is deliberately separate from the shared benchmark LiteLLM proxy.
model_list:
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  # Codex authenticates to this bridge with a bridge-local key. The bridge then
  # authenticates directly to api.anthropic.com with ANTHROPIC_API_KEY above.
  master_key: os.environ/CODEX_OPUS_RESPONSES_API_KEY

litellm_settings:
  telemetry: false
