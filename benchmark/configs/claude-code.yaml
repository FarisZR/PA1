job_name: claude-code
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 10

environment:
  type: docker

datasets:
  - path: ../DeepSWE/tasks
    task_names:
      - expr-try-catch-errors
      - katex-multicolumn-array-spans
      - python-statemachine-state-data-scoping
      - oxvg-structural-selector-preservation
      - effect-sse-httpapi-streaming
      - scriggo-method-declarations
      - csstree-shorthand-expansion-compression
      - fastapi-implicit-head-options
      - boa-hierarchical-evaluation-cancellation
      - koota-composite-trait-aspects

agents:
  - name: claude-code
    model_name: anthropic/claude-opus-5
    env:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DISABLE_AUTOUPDATER: "1"
    kwargs:
      version: "2.1.247"
      reasoning_effort: medium

  # Non-Anthropic models use LiteLLM's Anthropic-compatible surface. The proxy
  # alias gpt-5.6-luna must enforce the benchmark's 272k context cap.
  - name: claude-code
    model_name: gpt-5.6-luna
    env:
      ANTHROPIC_AUTH_TOKEN: ${LITELLM_API_KEY}
      ANTHROPIC_BASE_URL: ${LITELLM_ANTHROPIC_BASE_URL}
      DISABLE_AUTOUPDATER: "1"
    kwargs:
      version: "2.1.247"
      reasoning_effort: max

  - name: claude-code
    model_name: deepseek-v4-flash-0731
    env:
      ANTHROPIC_AUTH_TOKEN: ${LITELLM_API_KEY}
      ANTHROPIC_BASE_URL: ${LITELLM_ANTHROPIC_BASE_URL}
      DISABLE_AUTOUPDATER: "1"
    kwargs:
      version: "2.1.247"
      reasoning_effort: max

  - name: claude-code
    model_name: kimi-k3
    env:
      ANTHROPIC_AUTH_TOKEN: ${LITELLM_API_KEY}
      ANTHROPIC_BASE_URL: ${LITELLM_ANTHROPIC_BASE_URL}
      DISABLE_AUTOUPDATER: "1"
    kwargs:
      version: "2.1.247"
      reasoning_effort: max
