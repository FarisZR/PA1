job_name: claude-code
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 10

environment:
  type: docker

datasets:
  - path: ../DeepSWE/tasks
    task_names:
      - expr-try-catch-errors
      - katex-multicolumn-array-spans
      - python-statemachine-state-data-scoping
      - oxvg-structural-selector-preservation
      - effect-sse-httpapi-streaming
      - scriggo-method-declarations
      - csstree-shorthand-expansion-compression
      - fastapi-implicit-head-options
      - boa-hierarchical-evaluation-cancellation
      - koota-composite-trait-aspects

agents:
  # Claude Code recognizes the [1m] suffix used by third-party integrations
  # such as Z.AI. Explicitly lower Luna's auto-compaction window to 272k so its
  # effective context matches Codex's short-context configuration.
  - name: claude-code
    model_name: gpt-5.6-luna[1m]
    env:
      ANTHROPIC_AUTH_TOKEN: ${LITELLM_API_KEY}
      ANTHROPIC_BASE_URL: ${LITELLM_ANTHROPIC_BASE_URL}
      ANTHROPIC_DEFAULT_FABLE_MODEL: gpt-5.6-luna[1m]
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "272000"
      DISABLE_AUTOUPDATER: "1"
    kwargs:
      version: "2.1.251"
      reasoning_effort: max

  # The proxy must expose these exact [1m] aliases. The suffix prevents Claude
  # Code from treating an otherwise unknown third-party model as a small-context
  # model; their normal provider context is retained.
  - name: claude-code
    model_name: deepseek-v4-flash-0731[1m]
    env:
      ANTHROPIC_AUTH_TOKEN: ${LITELLM_API_KEY}
      ANTHROPIC_BASE_URL: ${LITELLM_ANTHROPIC_BASE_URL}
      ANTHROPIC_DEFAULT_FABLE_MODEL: deepseek-v4-flash-0731[1m]
      # DeepSeek current Claude Code integration compacts the 1M V4 family here.
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "786432"
      DISABLE_AUTOUPDATER: "1"
    kwargs:
      version: "2.1.251"
      reasoning_effort: max

  - name: claude-code
    model_name: kimi-k3[1m]
    env:
      ANTHROPIC_AUTH_TOKEN: ${LITELLM_API_KEY}
      ANTHROPIC_BASE_URL: ${LITELLM_ANTHROPIC_BASE_URL}
      ANTHROPIC_DEFAULT_FABLE_MODEL: kimi-k3[1m]
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "1048576"
      DISABLE_AUTOUPDATER: "1"
    kwargs:
      version: "2.1.251"
      reasoning_effort: max
