job_name: pi
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 10

environment:
  type: docker

datasets:
  - path: ../DeepSWE/tasks
    task_names:
      - expr-try-catch-errors
      - katex-multicolumn-array-spans
      - python-statemachine-state-data-scoping
      - oxvg-structural-selector-preservation
      - effect-sse-httpapi-streaming
      - scriggo-method-declarations
      - csstree-shorthand-expansion-compression
      - fastapi-implicit-head-options
      - boa-hierarchical-evaluation-cancellation
      - koota-composite-trait-aspects

agents:
  # Native Pi provider/model IDs are intentional. They preserve Pi 0.84.3's
  # built-in model capabilities, compatibility flags, and official pricing.
  - name: pi
    model_name: anthropic/claude-opus-5
    env:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    kwargs:
      version: "0.84.3"
      thinking: medium

  # Pi's direct OpenAI Luna entry already uses the 272k short-context window and
  # official OpenAI price table. Only its endpoint/auth are redirected to LiteLLM.
  - name: pi
    model_name: openai/gpt-5.6-luna
    env:
      OPENAI_API_KEY: ${LITELLM_API_KEY}
      OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
    kwargs:
      version: "0.84.3"
      thinking: max

  # The DeepSeek API's stable model ID currently resolves to the selected
  # DeepSeek-V4-Flash-0731 checkpoint. Keep that upstream ID so Pi retains its
  # native 1M context, thinking compatibility, and launch-price metadata.
  - name: pi
    model_name: deepseek/deepseek-v4-flash
    env:
      DEEPSEEK_API_KEY: ${LITELLM_API_KEY}
    kwargs:
      version: "0.84.3"
      thinking: max
      pi_config:
        providers:
          deepseek:
            baseUrl: __LITELLM_OPENAI_BASE_URL__

  # Likewise, use Pi's native Moonshot entry rather than presenting Kimi as an
  # OpenAI model. This preserves Kimi-specific multi-turn/tool compatibility and
  # Pi's official launch pricing metadata.
  - name: pi
    model_name: moonshotai/kimi-k3
    env:
      MOONSHOT_API_KEY: ${LITELLM_API_KEY}
    kwargs:
      version: "0.84.3"
      thinking: max
      pi_config:
        providers:
          moonshotai:
            baseUrl: __LITELLM_OPENAI_BASE_URL__
            apiKey: $MOONSHOT_API_KEY
