# OpenCode V2 primary Luna profile. The built-in OpenAI Responses profile is
# preserved while its endpoint is redirected to the shared CLIProxyAPI route.
job_name: opencode-v2-luna-272k
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 6
retry:
  max_retries: 1
  # Retry transport/gateway faults only. Agent timeouts are a genuine efficiency
  # result on this task set, and verifier/reward failures are grading faults, so
  # re-running a whole trial for either would corrupt the measurement.
  exclude_exceptions:
    - AgentTimeoutError
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
    # OpenCode 2.0.8 can leave the CLI exit status at 1 after a recovered
    # session-step failure. Treat any non-zero agent exit as the recorded
    # harness outcome instead of launching a second whole-trial attempt.
    - NonZeroAgentExitCodeError
    # An operator interrupt (Ctrl-C) surfaces as CancelledError. It is not a
    # transport fault, and retrying it relaunches every in-flight trial.
    - CancelledError
environment:
  type: docker
datasets:
- path: ../DeepSWE/tasks
  task_names:
  - expr-try-catch-errors
  - katex-multicolumn-array-spans
  - python-statemachine-state-data-scoping
  - oxvg-structural-selector-preservation
  - effect-sse-httpapi-streaming
  - scriggo-method-declarations
  - csstree-shorthand-expansion-compression
  - fastapi-implicit-head-options
  - boa-hierarchical-evaluation-cancellation
  - koota-composite-trait-aspects
agents:
- name: opencode-v2
  model_name: openai/gpt-5.6-luna
  env:
    CODEX_CLIPROXY_API_KEY: ${CODEX_CLIPROXY_API_KEY}
    CODEX_CLIPROXY_BASE_URL: ${CODEX_CLIPROXY_BASE_URL}
  kwargs:
    variant: max
    version: "2.0.8"
    opencode_v2_checksums:
      linux-x64: 8390d897ce5cfcb08dff291558cd1ae5b09cb27e1d287aa1a5fcc96908cdf625
      linux-arm64: 957b1d890b2cde215f1d750885b23254e74014cc167a7b324a946fe73b7af0ce
    restrict_model: true
    model_catalog_file: benchmark/references/opencode-v2-model-catalog-2.0.8.json
    opencode_v2_config:
      update: disable
      share: disabled
      websearch: false
      providers:
        openai:
          env:
          - CODEX_CLIPROXY_API_KEY
          settings:
            baseURL: '{env:CODEX_CLIPROXY_BASE_URL}'
          # Preserve the built-in Responses profile while making its output
          # ceiling explicit on the gateway wire.
          #
          # PA1 #17: every harness holds Luna to the 272,000-token window.
          # Codex uses the native 272,000 entry, Claude Code sets
          # CLAUDE_CODE_AUTO_COMPACT_WINDOW=272000 and Pi's bundled entry is
          # already 272000. OpenAI prices input above 272,000 at 2x and
          # benchmark/pricing.yaml models no such tier, so inheriting the full
          # 1,050,000 window would under-cost this harness relative to the
          # others instead of measuring a harness property.
          models:
            gpt-5.6-luna:
              limit:
                # Leave input inherited from the catalogue. With this reduced
                # context, OpenCode's context budget controls compaction.
                context: 272000
                output: 128000
              body:
                max_output_tokens: 128000
