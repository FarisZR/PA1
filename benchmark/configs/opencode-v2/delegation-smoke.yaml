# Small OpenCode V2 delegation smoke. This deliberately uses only GLM low and
# requires one native general-subagent call so the collected session tree can
# be compared with the official OpenCode V2 session/message records.
job_name: opencode-v2-glm-delegation-smoke
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 1
retry:
  max_retries: 0

environment:
  type: docker

tasks:
  - path: benchmark/tasks/opencode-v2-delegation-smoke

agents:
  - name: opencode-v2
    model_name: zai/glm-5.3-flash
    env:
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
    kwargs:
      variant: low
      version: "2.0.6"
      opencode_v2_checksums:
        linux-x64: 6f999433a2b44be2cd690387e2451b99b6c3a8426e7dc6eff54f4b3ced90fef3
        linux-arm64: cdb2ed114a00c8aeb438735ac6bef9003277a452b432b512c4af670da9950f53
      restrict_model: true
      model_catalog_file: benchmark/references/opencode-v2-model-catalog-2.0.6.json
      opencode_v2_config:
        websearch: false
        providers:
          zai:
            env: [LITELLM_API_KEY]
            settings:
              baseURL: __LITELLM_OPENAI_BASE_URL__
            models:
              glm-5.3-flash:
                modelID: glm-5p3-flash
                name: GLM-5.3-Flash
                family: glm-flash
                capabilities:
                  tools: true
                  input: [text, image, video, pdf]
                  output: [text]
                limit:
                  context: 1000000
                  output: 131072
                body:
                  max_tokens: 8192
                compatibility:
                  maxTokensField: max_tokens
                  reasoningField: reasoning_content
                cost:
                  input: 0.075
                  output: 0.25
                  cache:
                    read: 0.015
                    write: 0.0
                variants:
                  - id: low
                    settings:
                      reasoningEffort: low
                  - id: high
                    settings:
                      reasoningEffort: high
                  - id: max
                    settings:
                      reasoningEffort: max
