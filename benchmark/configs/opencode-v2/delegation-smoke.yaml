# Small OpenCode V2 delegation smoke. This deliberately uses only GLM low and
# requires one native general-subagent call so the collected session tree can
# be compared with the official OpenCode V2 session/message records.
job_name: opencode-v2-glm-delegation-smoke
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 1
retry:
  max_retries: 0

environment:
  type: docker

tasks:
  - path: benchmark/tasks/opencode-v2-delegation-smoke

agents:
  - name: opencode-v2
    model_name: litellm/glm-5p3-flash
    env:
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
    kwargs:
      variant: low
      version: "2.0.4"
      opencode_v2_checksums:
        linux-x64: ba4580e6d79df45f600def921cd2b3d1d873bb36bc8755cfc299d4890a2dc20f
        linux-arm64: 13417a0f61176b6812e54c9e90fb905e3424204190edc85d8fa60daf96fd0610
      restrict_model: true
      opencode_v2_config:
        websearch: false
        providers:
          litellm:
            name: LiteLLM
            canonical: openai
            env: [LITELLM_API_KEY]
            package: "aisdk:@ai-sdk/openai-compatible"
            settings:
              baseURL: __LITELLM_OPENAI_BASE_URL__
            models:
              glm-5p3-flash:
                modelID: glm-5p3-flash
                name: GLM-5.3-Flash
                limit:
                  context: 1048576
                  output: 131072
                body:
                  max_tokens: 8192
                compatibility:
                  maxTokensField: max_tokens
                  reasoningField: reasoning_content
                cost:
                  input: 0.15
                  output: 0.5
                  cache:
                    read: 0.03
                    write: 0.0
                variants:
                  - id: low
                    settings:
                      reasoningEffort: low
