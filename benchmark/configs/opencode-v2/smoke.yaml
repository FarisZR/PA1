# Tiny real-task smoke for the OpenCode V2 adapter. This is intentionally
# separate from primary benchmark jobs: both models run at low effort, output
# is capped at 8192, retries are disabled, and only one trivial task is used.
job_name: opencode-v2-glm-luna-low-smoke
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 1
retry:
  max_retries: 0

environment:
  type: docker

tasks:
  - path: benchmark/tasks/opencode-v2-smoke

agents:
  - name: opencode-v2
    model_name: litellm/glm-5p3-flash#low
    env:
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
    kwargs:
      version: "2.0.3"
      opencode_v2_checksums:
        linux-x64: 4b8c2cad67297c715adff18a569c8808b22fe23c7197fd1775bc11cbfa04022d
        linux-arm64: bc35547e678c68aaec1b2aa1623d1d77ec2585db6204574724826e40f20a7693
      restrict_model: true
      opencode_v2_config:
        providers:
          litellm:
            name: LiteLLM
            canonical: openai
            env: [LITELLM_API_KEY]
            package: "aisdk:@ai-sdk/openai-compatible"
            settings:
              baseURL: __LITELLM_OPENAI_BASE_URL__
            models:
              glm-5p3-flash:
                modelID: glm-5p3-flash
                name: GLM-5.3-Flash
                limit:
                  context: 1048576
                  output: 131072
                body:
                  max_tokens: 8192
                compatibility:
                  maxTokensField: max_tokens
                  reasoningField: reasoning_content
                cost:
                  input: 0.15
                  output: 0.5
                  cache:
                    read: 0.03
                    write: 0.0
                variants:
                  - id: low
                    settings:
                      reasoningEffort: low

  - name: opencode-v2
    model_name: litellm/gpt-5.6-luna#low
    env:
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
    kwargs:
      version: "2.0.3"
      opencode_v2_checksums:
        linux-x64: 4b8c2cad67297c715adff18a569c8808b22fe23c7197fd1775bc11cbfa04022d
        linux-arm64: bc35547e678c68aaec1b2aa1623d1d77ec2585db6204574724826e40f20a7693
      restrict_model: true
      opencode_v2_config:
        providers:
          litellm:
            name: LiteLLM
            canonical: openai
            env: [LITELLM_API_KEY]
            # This is the built-in Responses entrypoint in OpenCode 2.0.3.
            package: "@opencode-ai/ai/providers/openai/responses"
            settings:
              baseURL: __LITELLM_OPENAI_BASE_URL__
            models:
              gpt-5.6-luna:
                modelID: gpt-5.6-luna
                name: GPT-5.6 Luna
                limit:
                  context: 272000
                  input: 144000
                  output: 128000
                body:
                  max_output_tokens: 8192
                cost:
                  input: 0.2
                  output: 1.2
                  cache:
                    read: 0.02
                    write: 0.25
                variants:
                  - id: low
                    settings:
                      reasoningEffort: low
