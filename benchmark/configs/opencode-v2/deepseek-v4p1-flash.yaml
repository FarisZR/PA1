# OpenCode V2 primary profile. The adapter and provider path are validated for the current benchmark setup.
job_name: opencode-v2-deepseek-v4p1-flash
jobs_dir: benchmark/runs
n_attempts: 1
# This profile is 10 trials, so 30 meant "all at once". Measured OpenCode V2
# GLM demand is 594,226 prompt TPM/trial; scaling by the estimated 2.05x
# DeepSeek/GLM ratio puts DeepSeek near 1,218,163, so ten at once would be
# 169% of the 7.2M observed idle limit. Five is 85% of it, the same buffer the
# primary DeepSeek job uses. Six would be 101.5% — over the limit, not under.
n_concurrent_trials: 5
retry:
  max_retries: 1
  # Intent: replace transport/gateway-invalidated attempts. Pier implements
  # retry eligibility by exclusion, so any exception type not listed below can
  # still trigger a replacement attempt. Primary analysis resolves accidental
  # non-transport retries through data/benchmark-results/primary-attempt-overrides.json.
  exclude_exceptions:
    - AgentTimeoutError
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
    # An operator interrupt (Ctrl-C) surfaces as CancelledError. It is not a
    # transport fault, and retrying it relaunches every in-flight trial.
    - CancelledError
environment:
  type: docker
datasets:
- path: ../DeepSWE/tasks
  task_names:
  - expr-try-catch-errors
  - katex-multicolumn-array-spans
  - python-statemachine-state-data-scoping
  - oxvg-structural-selector-preservation
  - effect-sse-httpapi-streaming
  - scriggo-method-declarations
  - csstree-shorthand-expansion-compression
  - fastapi-implicit-head-options
  - boa-hierarchical-evaluation-cancellation
  - koota-composite-trait-aspects
agents:
- name: opencode-v2
  model_name: deepseek/deepseek-v4p1-flash
  env:
    LITELLM_API_KEY: ${LITELLM_API_KEY}
    LITELLM_OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
  kwargs:
    variant: max
    version: "2.0.8"
    opencode_v2_checksums:
      linux-x64: 8390d897ce5cfcb08dff291558cd1ae5b09cb27e1d287aa1a5fcc96908cdf625
      linux-arm64: 957b1d890b2cde215f1d750885b23254e74014cc167a7b324a946fe73b7af0ce
    restrict_model: true
    model_catalog_file: benchmark/references/opencode-v2-model-catalog-2.0.8.json
    opencode_v2_config:
      update: disable
      share: disabled
      websearch: false
      providers:
        deepseek:
          env:
          - LITELLM_API_KEY
          package: "@opencode/ai/providers/fireworks"
          settings:
            baseURL: '{env:LITELLM_OPENAI_BASE_URL}'
          models:
            deepseek-v4p1-flash:
              modelID: deepseek-v4p1-flash
              body:
                max_tokens: 384000
              compatibility:
                maxTokensField: max_tokens
                reasoningField: reasoning_content
              variants:
              - id: low
                settings:
                  reasoningEffort: low
              - id: high
                settings:
                  reasoningEffort: high
              - id: max
                settings:
                  reasoningEffort: max
