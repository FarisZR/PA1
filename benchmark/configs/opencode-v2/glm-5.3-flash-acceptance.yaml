# OpenCode V2 GLM-5.3-Flash ACCEPTANCE job (PA1 issues #41, #40, #37, #9).
#
# GLM 5.3 Flash low is acceptance-only: it validates the Pier OpenCode V2
# adapter end to end on the cheap Fireworks-backed route before any primary
# OpenCode spending. It is NOT part of the primary benchmark batch, and there
# is no OpenCode primary job for GLM.
#
# The gateway exposes GLM-5.3-Flash as `glm-5p3-flash` via its existing
# LiteLLM Fireworks-backed route; OpenCode reaches it as a native V2
# `openai-compatible` provider (Chat Completions), not through the Codex
# compatibility bridge.
#
# The `low` variant is the single supported effective reasoning control on the
# Fireworks route: `reasoning_effort: "low"` alone, no conflicting `thinking`
# field. The same `provider/model#variant` selection is pinned on the root
# agent, every subagent, and compaction by the adapter's restrict_model.
job_name: opencode-v2-glm-5.3-flash-acceptance
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 2
retry:
  max_retries: 0
  # Acceptance runs fail loudly and are re-run by hand after a config fix;
  # automatic retry would only hide adapter faults. The retry policy itself is
  # tracked separately in PA1 issue #37.
  exclude_exceptions:
    - AgentTimeoutError
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
    - TrialCancelledError

environment:
  type: docker

datasets:
  - path: ../DeepSWE/tasks
    task_names:
      - anko-default-function-arguments

agents:
  - name: opencode-v2
    model_name: litellm/glm-5p3-flash#low
    env:
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
    kwargs:
      version: "2.0.3"
      opencode_v2_checksums:
        linux-x64: 4b8c2cad67297c715adff18a569c8808b22fe23c7197fd1775bc11cbfa04022d
        linux-arm64: bc35547e678c68aaec1b2aa1623d1d77ec2585db6204574724826e40f20a7693
      restrict_model: true
      opencode_v2_config:
        providers:
          litellm:
            name: LiteLLM
            canonical: openai
            env:
              - LITELLM_API_KEY
            package: "aisdk:@ai-sdk/openai-compatible"
            settings:
              baseURL: __LITELLM_OPENAI_BASE_URL__
            models:
              # Explicit committed GLM profile: the bundled models.dev
              # snapshot in @opencode/cli 2.0.3 has no glm-5.3-flash entry, so
              # this block is the provenance for the benchmark's GLM identity.
              # Context/output follow the Pi and Codex entries for the same
              # Fireworks-backed checkpoint (1,048,576 context / 131,072
              # output ceiling).
              #
              # PA1 issue #40: V2 does not set max output tokens for unknown
              # models on its own. This frozen profile therefore owns the
              # explicit Chat Completions body max_tokens override while
              # retaining limit.output as metadata.
              glm-5p3-flash:
                modelID: glm-5p3-flash
                name: GLM-5.3-Flash
                limit:
                  context: 1048576
                  output: 131072
                # Acceptance-only small cap. Primary profiles retain their
                # frozen 131072 output ceiling and body override.
                body:
                  max_tokens: 8192
                # PA1 normalized pricing from benchmark/pricing.yaml. These
                # are profile provenance values, not Fireworks invoice rates.
                cost:
                  input: 0.15
                  output: 0.5
                  cache:
                    read: 0.03
                    write: 0.0
                compatibility:
                  maxTokensField: max_tokens
                  reasoningField: reasoning_content
                variants:
                  - id: low
                    settings:
                      # The one supported effective low control on the
                      # Fireworks route; must not be paired with a `thinking`
                      # object.
                      reasoningEffort: low
