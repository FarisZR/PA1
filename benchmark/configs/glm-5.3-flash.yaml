# GLM-5.3-Flash on Fireworks through the AiOrbit LiteLLM gateway (1.102.1).
# Rerun of the excluded 2026-09-20 batch (data/benchmark-results/glm-5.3-flash),
# which ran on LiteLLM 1.101.0 and lost prior reasoning (PA1 #111). 1.102.0+
# forwards reasoning_content again; Claude Code avoids the #94 effort
# normalization through CLIProxyAPI. Everything else matches glm-5.3-sub except
# the Fireworks transport workarounds (PA1 #53) and the gateway model id.
job_name: glm-5.3-flash-rerun
jobs_dir: benchmark/runs
n_attempts: 1
# Sized from the AiOrbit bridge logs and trajectories (PA1 #129), not from the
# earlier 737k-per-trial / 7.2M-idle arithmetic, which understated load ~3x.
#
# - Live limits on 2026-09-24 (tokens/min): 32.96M total prompt, 4.39M
#   cache-adjusted, 1.8M uncached, 72k generated. GLM kept its warmed limits
#   from the 2026-09-21 run.
# - The 2026-09-21 run at 8 drew, per running trial and minute, a median 2.13M
#   total prompt (p90 2.85M) and ~0.30M cache-adjusted (p90 0.40M, counting
#   cached tokens at 1/7.5, the observed total/cache-adjusted limit ratio).
#   Current limits therefore allow ~11-15 trials. Kept reasoning enlarges every
#   prompt, so 10 leaves room for that.
# - Limits step up 1.25x after ~16 min of near-limit load. The 2026-09-20 429s
#   hit only the first 1.5 minutes of a 30-trial start, when empty prompt
#   caches pushed uncached load (2.2M) past the 1.8M uncached limit.
#
# Run the OpenCode V2 job alongside this one, started ~30 minutes later
# (see benchmark/README.md), for ~16 concurrent trials in total.
n_concurrent_trials: 10
retry:
  max_retries: 1
  # Retry transport/gateway faults only. Agent timeouts are a genuine efficiency
  # result on this task set, and verifier/reward failures are grading faults, so
  # re-running a whole trial for either would corrupt the measurement.
  exclude_exceptions:
    - AgentTimeoutError
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
    - CancelledError

environment:
  type: docker

datasets:
  - path: ../DeepSWE/tasks
    task_names:
      - expr-try-catch-errors
      - katex-multicolumn-array-spans
      - python-statemachine-state-data-scoping
      - oxvg-structural-selector-preservation
      - effect-sse-httpapi-streaming
      - scriggo-method-declarations
      - csstree-shorthand-expansion-compression
      - fastapi-implicit-head-options
      - boa-hierarchical-evaluation-cancellation
      - koota-composite-trait-aspects

agents:
  - name: pi
    model_name: zai/glm-5p3-flash
    env:
      ZAI_API_KEY: ${LITELLM_API_KEY}
    kwargs:
      version: "0.84.4"
      thinking: max
      pi_config:
        providers:
          zai:
            baseUrl: __LITELLM_OPENAI_BASE_URL__
            apiKey: $ZAI_API_KEY
            models:
              # Transport alias for GLM-5.3-Flash. This matches Pi 0.84.4's
              # built-in zai/glm-5.3-flash profile; only the API-facing id and
              # provider endpoint are overridden for our gateway.
              - id: glm-5p3-flash
                name: GLM-5.3-Flash
                api: openai-completions
                reasoning: true
                thinkingLevelMap:
                  "off": null
                  minimal: null
                  low: low
                  medium: null
                  high: high
                  xhigh: null
                  max: max
                input: [text, image]
                cost:
                  input: 0.15
                  output: 0.5
                  cacheRead: 0.03
                  cacheWrite: 0
                compat:
                  supportsStore: false
                  supportsDeveloperRole: false
                  supportsReasoningEffort: true
                  maxTokensField: max_tokens
                  # Overridden from the bundled profile's "zai", which emits
                  # `thinking` alongside `reasoning_effort`. The gateway's
                  # Fireworks route rejects that pair with HTTP 400 before the
                  # first turn (PA1 #53), so every Pi trial failed with zero
                  # tokens. "openai" sends `reasoning_effort` alone, the same
                  # path Kimi K3 and DeepSeek V4.1 Flash already take.
                  thinkingFormat: openai
                  # `tool_stream` is a Z.AI-only request extension. The PA1
                  # route is Fireworks-backed and rejects that field with HTTP 400.
                  zaiToolStream: false
                contextWindow: 1000000
                maxTokens: 131072

  # Claude Code goes through CLIProxyAPI, not LiteLLM's /v1/messages adapter,
  # which normalizes effort max to high for this deployment (PA1 #94). The
  # bridge model entry uses is-compat and keeps thinking history as
  # reasoning_content.
  - name: claude-code
    model_name: glm-5p3-flash[1m]
    env:
      ANTHROPIC_AUTH_TOKEN: ${CODEX_CLIPROXY_API_KEY}
      ANTHROPIC_BASE_URL: ${CODEX_CLIPROXY_ANTHROPIC_BASE_URL}
      ANTHROPIC_DEFAULT_FABLE_MODEL: glm-5p3-flash[1m]
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "1000000"
      API_FORCE_IDLE_TIMEOUT: "0"
      CLAUDE_STREAM_IDLE_TIMEOUT_MS: "1800000"
      DISABLE_AUTOUPDATER: "1"
    kwargs:
      version: "2.1.251"
      reasoning_effort: max
      disallowed_tools: "EnterPlanMode,WebSearch"

  - name: codex
    model_name: zai/glm-5p3-flash
    env:
      CODEX_CLIPROXY_API_KEY: ${CODEX_CLIPROXY_API_KEY}
    kwargs:
      version: "0.151.0"
      command_model_name: glm-5p3-flash
      reasoning_effort: max
      restrict_model_catalog: true
      model_catalog_file: benchmark/generated/codex-thirdparty-models.json
      config_toml_file: benchmark/generated/codex-cliproxy-no-web-search.toml
