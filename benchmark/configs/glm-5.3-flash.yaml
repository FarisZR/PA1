job_name: glm-5.3-flash
jobs_dir: benchmark/runs
n_attempts: 1
# GLM-5.3-Flash turns around far faster than Kimi K3, so the same trial count
# produces a much denser request stream: at 30 concurrent, Kimi averaged 12.7
# upstream req/min and GLM averaged 71.3 (peak 141). The 2026-09-20 run at 30
# was throttled by the gateway's Fireworks route in three windows, which Codex
# did not survive. 12 targets Kimi-comparable gateway load rather than
# Kimi-comparable trial count.
n_concurrent_trials: 12
retry:
  max_retries: 1
  # Retry transport/gateway faults only. Agent timeouts are a genuine efficiency
  # result on this task set, and verifier/reward failures are grading faults, so
  # re-running a whole trial for either would corrupt the measurement.
  exclude_exceptions:
    - AgentTimeoutError
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
    - CancelledError

environment:
  type: docker

datasets:
  - path: ../DeepSWE/tasks
    task_names:
      - expr-try-catch-errors
      - katex-multicolumn-array-spans
      - python-statemachine-state-data-scoping
      - oxvg-structural-selector-preservation
      - effect-sse-httpapi-streaming
      - scriggo-method-declarations
      - csstree-shorthand-expansion-compression
      - fastapi-implicit-head-options
      - boa-hierarchical-evaluation-cancellation
      - koota-composite-trait-aspects

agents:
  - name: pi
    model_name: zai/glm-5p3-flash
    env:
      ZAI_API_KEY: ${LITELLM_API_KEY}
    kwargs:
      version: "0.84.4"
      thinking: max
      pi_config:
        providers:
          zai:
            baseUrl: __LITELLM_OPENAI_BASE_URL__
            apiKey: $ZAI_API_KEY
            models:
              # Transport alias for GLM-5.3-Flash. This matches Pi 0.84.4's
              # built-in zai/glm-5.3-flash profile; only the API-facing id and
              # provider endpoint are overridden for our gateway.
              - id: glm-5p3-flash
                name: GLM-5.3-Flash
                api: openai-completions
                reasoning: true
                thinkingLevelMap:
                  "off": null
                  minimal: null
                  low: low
                  medium: null
                  high: high
                  xhigh: null
                  max: max
                input: [text, image]
                cost:
                  input: 0.15
                  output: 0.5
                  cacheRead: 0.03
                  cacheWrite: 0
                compat:
                  supportsStore: false
                  supportsDeveloperRole: false
                  supportsReasoningEffort: true
                  maxTokensField: max_tokens
                  # Overridden from the bundled profile's "zai", which emits
                  # `thinking` alongside `reasoning_effort`. The gateway's
                  # Fireworks route rejects that pair with HTTP 400 before the
                  # first turn (PA1 #53), so every Pi trial failed with zero
                  # tokens. "openai" sends `reasoning_effort` alone, the same
                  # path Kimi K3 and DeepSeek V4.1 Flash already take.
                  thinkingFormat: openai
                  zaiToolStream: true
                contextWindow: 1000000
                maxTokens: 131072

  - name: claude-code
    model_name: glm-5p3-flash[1m]
    env:
      ANTHROPIC_AUTH_TOKEN: ${LITELLM_API_KEY}
      ANTHROPIC_BASE_URL: ${LITELLM_ANTHROPIC_BASE_URL}
      ANTHROPIC_DEFAULT_FABLE_MODEL: glm-5p3-flash[1m]
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "1048576"
      API_FORCE_IDLE_TIMEOUT: "0"
      CLAUDE_STREAM_IDLE_TIMEOUT_MS: "1800000"
      DISABLE_AUTOUPDATER: "1"
    kwargs:
      version: "2.1.251"
      reasoning_effort: max
      disallowed_tools: "EnterPlanMode,WebSearch"

  - name: codex
    model_name: zai/glm-5p3-flash
    env:
      CODEX_CLIPROXY_API_KEY: ${CODEX_CLIPROXY_API_KEY}
    kwargs:
      version: "0.151.0"
      command_model_name: glm-5p3-flash
      reasoning_effort: max
      restrict_model_catalog: true
      model_catalog_file: benchmark/generated/codex-thirdparty-models.json
      config_toml_file: benchmark/generated/codex-cliproxy-no-web-search.toml
