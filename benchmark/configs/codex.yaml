job_name: codex
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 10

environment:
  type: docker

datasets:
  - path: ../DeepSWE/tasks
    task_names:
      - expr-try-catch-errors
      - katex-multicolumn-array-spans
      - python-statemachine-state-data-scoping
      - oxvg-structural-selector-preservation
      - effect-sse-httpapi-streaming
      - scriggo-method-declarations
      - csstree-shorthand-expansion-compression
      - fastapi-implicit-head-options
      - boa-hierarchical-evaluation-cancellation
      - koota-composite-trait-aspects

agents:
  # Keep Luna on Codex's built-in OpenAI provider. Pier only overrides the
  # endpoint, so OpenAI-specific Codex behavior remains enabled. The restricted
  # catalog is derived from this frozen Codex build and keeps its 272k window.
  - name: codex
    model_name: openai/gpt-5.6-luna
    env:
      OPENAI_API_KEY: ${LITELLM_API_KEY}
      OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
    kwargs:
      version: "0.151.0"
      reasoning_effort: max
      restrict_model_catalog: true

  # Codex has no Anthropic Messages wire protocol. This cell therefore uses a
  # dedicated Responses-to-Anthropic bridge, separate from the shared LiteLLM
  # gateway. The bridge's upstream connection must be the direct Anthropic API.
  - name: codex
    model_name: anthropic/claude-opus-5
    env:
      CODEX_OPUS_RESPONSES_API_KEY: ${CODEX_OPUS_RESPONSES_API_KEY}
    kwargs:
      version: "0.151.0"
      command_model_name: claude-opus-5
      reasoning_effort: medium
      restrict_model_catalog: true
      model_catalog_file: benchmark/generated/codex-thirdparty-models.json
      config_toml_file: benchmark/generated/codex-opus.toml

  - name: codex
    model_name: deepseek/deepseek-v4-flash-0731
    env:
      LITELLM_API_KEY: ${LITELLM_API_KEY}
    kwargs:
      version: "0.151.0"
      command_model_name: deepseek-v4-flash-0731
      reasoning_effort: max
      restrict_model_catalog: true
      model_catalog_file: benchmark/generated/codex-thirdparty-models.json
      config_toml_file: benchmark/generated/codex-litellm.toml

  - name: codex
    model_name: kimi/kimi-k3
    env:
      LITELLM_API_KEY: ${LITELLM_API_KEY}
    kwargs:
      version: "0.151.0"
      command_model_name: kimi-k3
      reasoning_effort: max
      restrict_model_catalog: true
      model_catalog_file: benchmark/generated/codex-thirdparty-models.json
      config_toml_file: benchmark/generated/codex-litellm.toml
