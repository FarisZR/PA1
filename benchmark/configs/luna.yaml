# GPT-5.6 Luna is routed through the pinned CLIProxyAPI instance backed by
# the benchmark ChatGPT subscription. Bounded six-trial execution limits the
# subscription burst while avoiding the cost of fully serial execution.
job_name: luna
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 6
retry:
  max_retries: 1
  # Intent: replace transport/gateway-invalidated attempts. Pier implements
  # retry eligibility by exclusion, so any exception type not listed below can
  # still trigger a replacement attempt. Primary analysis resolves accidental
  # non-transport retries through data/benchmark-results/primary-attempt-overrides.json.
  exclude_exceptions:
    - AgentTimeoutError
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
    # An operator interrupt (Ctrl-C) surfaces as CancelledError. It is not a
    # transport fault, and retrying it relaunches every in-flight trial.
    - CancelledError

environment:
  type: docker

datasets:
  - path: ../DeepSWE/tasks
    task_names:
      - expr-try-catch-errors
      - katex-multicolumn-array-spans
      - python-statemachine-state-data-scoping
      - oxvg-structural-selector-preservation
      - effect-sse-httpapi-streaming
      - scriggo-method-declarations
      - csstree-shorthand-expansion-compression
      - fastapi-implicit-head-options
      - boa-hierarchical-evaluation-cancellation
      - koota-composite-trait-aspects

agents:
  - name: pi
    model_name: openai/gpt-5.6-luna
    env:
      OPENAI_API_KEY: ${CODEX_CLIPROXY_API_KEY}
      OPENAI_BASE_URL: ${CODEX_CLIPROXY_BASE_URL}
    kwargs:
      version: "0.84.4"
      thinking: max

  - name: claude-code
    model_name: gpt-5.6-luna[1m]
    env:
      ANTHROPIC_AUTH_TOKEN: ${CODEX_CLIPROXY_API_KEY}
      ANTHROPIC_BASE_URL: ${CODEX_CLIPROXY_ANTHROPIC_BASE_URL}
      ANTHROPIC_DEFAULT_FABLE_MODEL: gpt-5.6-luna[1m]
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "272000"
      API_FORCE_IDLE_TIMEOUT: "0"
      CLAUDE_STREAM_IDLE_TIMEOUT_MS: "1800000"
      DISABLE_AUTOUPDATER: "1"
    kwargs:
      version: "2.1.251"
      reasoning_effort: max
      disallowed_tools: "EnterPlanMode,WebSearch"

  - name: codex
    model_name: openai/gpt-5.6-luna
    env:
      OPENAI_API_KEY: ${CODEX_CLIPROXY_API_KEY}
      OPENAI_BASE_URL: ${CODEX_CLIPROXY_BASE_URL}
    kwargs:
      version: "0.151.0"
      reasoning_effort: max
      restrict_model_catalog: true
      config_toml_file: benchmark/generated/codex-openai-no-web-search.toml
