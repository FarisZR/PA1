# BLOCKED on PA1#9 / Pier OpenCode 2 support.
#
# This is the intended primary OpenCode 2 job. The current FZR Pier `opencode`
# adapter installs OpenCode 1 (`opencode-ai`, executable `opencode`) and cannot
# execute this pinned V2 package (`@opencode-ai/cli`, executable `opencode2`).
# Do not run this config with the current adapter: doing so would benchmark the
# wrong harness or fail installation. Keep the model/provider settings here so
# the matrix is ready when the adapter lands.

job_name: opencode-v2
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 10

environment:
  type: docker

datasets:
  - path: ../DeepSWE/tasks
    task_names:
      - expr-try-catch-errors
      - katex-multicolumn-array-spans
      - python-statemachine-state-data-scoping
      - oxvg-structural-selector-preservation
      - effect-sse-httpapi-streaming
      - scriggo-method-declarations
      - csstree-shorthand-expansion-compression
      - fastapi-implicit-head-options
      - boa-hierarchical-evaluation-cancellation
      - koota-composite-trait-aspects

agents:
  - name: opencode
    model_name: anthropic/claude-opus-5
    env:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    kwargs:
      # This version belongs to @opencode-ai/cli, not the V1 opencode-ai package.
      version: "0.0.0-beta-18387"
      variant: medium
      opencode_config:
        autoupdate: false
        providers:
          anthropic:
            models:
              claude-opus-5:
                limit:
                  context: 1000000
                  output: 128000
                variants:
                  - id: medium
                    settings:
                      thinking:
                        type: adaptive
                      effort: medium

  # The LiteLLM endpoint is declared through V2's native provider schema. The
  # future Pier V2 adapter must resolve the base URL for its no-network egress
  # allowlist before launching the task sandbox.
  - name: opencode
    model_name: litellm/gpt-5.6-luna
    env:
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
    kwargs:
      version: "0.0.0-beta-18387"
      variant: max
      opencode_config:
        autoupdate: false
        providers:
          litellm:
            name: LiteLLM
            env: [LITELLM_API_KEY]
            package: "@opencode-ai/ai/providers/openai-compatible/responses"
            settings:
              baseURL: "{env:LITELLM_OPENAI_BASE_URL}"
            models:
              gpt-5.6-luna:
                modelID: gpt-5.6-luna
                name: GPT-5.6 Luna
                limit:
                  context: 272000
                  output: 128000
                variants:
                  - id: max
                    settings:
                      reasoningEffort: max

  - name: opencode
    model_name: litellm/deepseek-v4-flash-0731
    env:
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
    kwargs:
      version: "0.0.0-beta-18387"
      variant: max
      opencode_config:
        autoupdate: false
        providers:
          litellm:
            name: LiteLLM
            env: [LITELLM_API_KEY]
            package: "@opencode-ai/ai/providers/openai-compatible/responses"
            settings:
              baseURL: "{env:LITELLM_OPENAI_BASE_URL}"
            models:
              deepseek-v4-flash-0731:
                modelID: deepseek-v4-flash-0731
                name: DeepSeek V4 Flash 0731
                limit:
                  context: 1000000
                  output: 384000
                variants:
                  - id: max
                    settings:
                      reasoningEffort: max

  - name: opencode
    model_name: litellm/kimi-k3
    env:
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_OPENAI_BASE_URL: ${LITELLM_OPENAI_BASE_URL}
    kwargs:
      version: "0.0.0-beta-18387"
      variant: max
      opencode_config:
        autoupdate: false
        providers:
          litellm:
            name: LiteLLM
            env: [LITELLM_API_KEY]
            package: "@opencode-ai/ai/providers/openai-compatible/responses"
            settings:
              baseURL: "{env:LITELLM_OPENAI_BASE_URL}"
            models:
              kimi-k3:
                modelID: kimi-k3
                name: Kimi K3
                limit:
                  context: 1048576
                  output: 131072
                variants:
                  - id: max
                    settings:
                      reasoningEffort: max
