# Cheap end-to-end environment check before any primary benchmark spending.
# Runs one simple DeepSWE pilot task once on each currently runnable harness,
# using the same CLIProxyAPI-backed GPT-5.6 Luna routing/context policy as the
# primary benchmark but with low reasoning effort and serial execution.

job_name: smoke-luna
jobs_dir: benchmark/runs
n_attempts: 1
n_concurrent_trials: 1
retry:
  max_retries: 1
  # Retry transport/gateway faults only. Agent timeouts are a genuine efficiency
  # result on this task set, and verifier/reward failures are grading faults, so
  # re-running a whole trial for either would corrupt the measurement.
  exclude_exceptions:
    - AgentTimeoutError
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
    # An operator interrupt (Ctrl-C) surfaces as CancelledError. It is not a
    # transport fault, and retrying it relaunches every in-flight trial.
    - CancelledError

environment:
  type: docker

datasets:
  - path: ../DeepSWE/tasks
    task_names:
      - anko-default-function-arguments

agents:
  - name: pi
    model_name: openai/gpt-5.6-luna
    env:
      OPENAI_API_KEY: ${CODEX_CLIPROXY_API_KEY}
      OPENAI_BASE_URL: ${CODEX_CLIPROXY_BASE_URL}
    kwargs:
      version: "0.84.4"
      thinking: low

  - name: claude-code
    model_name: gpt-5.6-luna[1m]
    env:
      ANTHROPIC_AUTH_TOKEN: ${CODEX_CLIPROXY_API_KEY}
      ANTHROPIC_BASE_URL: ${CODEX_CLIPROXY_ANTHROPIC_BASE_URL}
      ANTHROPIC_DEFAULT_FABLE_MODEL: gpt-5.6-luna[1m]
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "272000"
      API_FORCE_IDLE_TIMEOUT: "0"
      CLAUDE_STREAM_IDLE_TIMEOUT_MS: "1800000"
      DISABLE_AUTOUPDATER: "1"
    kwargs:
      version: "2.1.251"
      reasoning_effort: low
      disallowed_tools: "EnterPlanMode,WebSearch"

  - name: codex
    model_name: openai/gpt-5.6-luna
    env:
      OPENAI_API_KEY: ${CODEX_CLIPROXY_API_KEY}
      OPENAI_BASE_URL: ${CODEX_CLIPROXY_BASE_URL}
    kwargs:
      version: "0.151.0"
      reasoning_effort: low
      restrict_model_catalog: true
      config_toml_file: benchmark/generated/codex-openai-no-web-search.toml
