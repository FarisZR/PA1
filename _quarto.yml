project:
  type: default
  output-dir: _output
  # Render only the root paper document; chapter files are included by pa1.qmd.
  render:
    - pa1.qmd

lang: en
bibliography: references.bib
csl: ieee.csl

format:
  typst:
    papersize: a4
    # pa1.qmd enables Roman numbering after the unnumbered title page.
    page-numbering: false
    fontsize: 12pt
    margin:
      x: 2.5cm
      y: 2.5cm
    linestretch: 1.2
    number-sections: true
    # DIN 1421 numbering (Leitlinien 4.1): 4.1.2 rather than Typst's default 4.1.b.
    section-numbering: 1.1.1
    # The declaration and abstract precede the manually placed contents list.
    toc: false
    toc-depth: 3
    lof: true
    lot: true
    # The bibliography is placed before the appendix in pa1.qmd instead.
    template-partials:
      - partials/biblio.typ
