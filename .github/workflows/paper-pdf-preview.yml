name: Paper PDF preview

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "pa1.qmd"
      - "chapters/**"
      - "_quarto.yml"
      - "references.bib"
      - "ieee.csl"
      - "requirements.txt"
      - "figures/**"
      - "scripts/figures.py"
      - "scripts/survey_analysis.py"
      - "data/**/*.csv"
      - "data/benchmark-results/**"
      - ".github/workflows/paper-pdf-preview.yml"
  push:
    branches: [main]
    paths:
      - "pa1.qmd"
      - "chapters/**"
      - "_quarto.yml"
      - "references.bib"
      - "ieee.csl"
      - "requirements.txt"
      - "figures/**"
      - "scripts/figures.py"
      - "scripts/survey_analysis.py"
      - "data/**/*.csv"
      - "data/benchmark-results/**"
      - ".github/workflows/paper-pdf-preview.yml"

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: paper-pdf-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_PAGES_PROJECT: fariszr-pa1

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install paper dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Render paper
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: pa1.qmd

      - name: Verify rendered PDF
        run: test -s _output/pa1.pdf

      - name: Set preview metadata
        id: preview
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "artifact=pa1-pdf-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "branch=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "commit=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=pa1-pdf-main" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload rendered PDF
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.preview.outputs.artifact }}
          path: _output/pa1.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Prepare browser preview
        run: |
          mkdir -p _preview
          cp _output/pa1.pdf _preview/pa1.pdf
          cat > _preview/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=pa1.pdf">
              <title>PA1 PDF preview</title>
            </head>
            <body>
              <p><a href="pa1.pdf">Open the rendered PA1 PDF.</a></p>
            </body>
          </html>
          EOF

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: >-
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
          env.CLOUDFLARE_API_TOKEN != '' &&
          env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          preCommands: >-
            wrangler pages project create ${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --production-branch=main || true
          command: >-
            pages deploy _preview
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ steps.preview.outputs.branch }}
            --commit-hash=${{ steps.preview.outputs.commit }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-pdf-preview -->';
            const body = `${marker}
            **Rendered PDF preview:** ${process.env.PREVIEW_URL}

            This preview is generated from the current pull request by Quarto and deployed to Cloudflare Pages.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
