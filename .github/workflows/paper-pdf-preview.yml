name: Paper PDF preview

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "pa1.qmd"
      - "chapters/**"
      - "_quarto.yml"
      - "references.bib"
      - "ieee.csl"
      - "requirements.txt"
      - "requirements-review.txt"
      - "figures/**"
      - "scripts/**/*.py"
      - "scripts/review/**"
      - "data/**/*.csv"
      - "data/benchmark-results/**"
      - "benchmark/pricing.yaml"
      - ".github/workflows/paper-pdf-preview.yml"
  push:
    branches: [main]
    paths:
      - "pa1.qmd"
      - "chapters/**"
      - "_quarto.yml"
      - "references.bib"
      - "ieee.csl"
      - "requirements.txt"
      - "requirements-review.txt"
      - "figures/**"
      - "scripts/**/*.py"
      - "scripts/review/**"
      - "data/**/*.csv"
      - "data/benchmark-results/**"
      - "benchmark/pricing.yaml"
      - ".github/workflows/paper-pdf-preview.yml"

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: paper-pdf-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_PAGES_PROJECT: fariszr-pa1

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-review.txt

      - name: Install paper dependencies
        run: python -m pip install -r requirements.txt

      - name: Install review dependencies
        if: github.event_name == 'pull_request'
        run: python -m pip install -r requirements-review.txt

      - name: Check review scripts
        if: github.event_name == 'pull_request'
        run: >-
          python -m py_compile
          scripts/review/build_review_pdf.py
          scripts/review/diff_ast.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      # Renders the PR head (the normal PDF), the PR base, and the commit before
      # the latest one, then renders the diff of the three as the review PDF.
      - name: Render paper and review PDF
        id: review-build
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: >-
          python scripts/review/build_review_pdf.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Render paper
        if: github.event_name == 'push' || steps.review-build.outcome != 'success'
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: pa1.qmd

      - name: Verify rendered PDF
        run: test -s _output/pa1.pdf

      - name: Read review metadata
        id: review
        if: github.event_name == 'pull_request'
        env:
          REVIEW_OUTCOME: ${{ steps.review-build.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path(".review/manifest.json")
          review_pdf = Path("_output/pa1-review.pdf")
          available = (
              os.environ["REVIEW_OUTCOME"] == "success"
              and manifest_path.exists()
              and review_pdf.exists()
              and review_pdf.stat().st_size > 0
          )
          manifest = json.loads(manifest_path.read_text()) if available else {}

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"available={str(available).lower()}", file=output)
              print(f"changes={manifest.get('change_count', 0)}", file=output)
              print(f"latest={manifest.get('latest_change_count', 0)}", file=output)
              print(f"figures={manifest.get('figure_changes', 0)}", file=output)
              print(f"prev={manifest.get('prev') or ''}", file=output)
          PY

      - name: Set preview metadata
        id: preview
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "artifact=pa1-pdf-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "branch=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "commit=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=pa1-pdf-main" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload PR PDFs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.preview.outputs.artifact }}
          path: |
            _output/pa1.pdf
            _output/pa1-review.pdf
            .review/manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload main PDF
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.preview.outputs.artifact }}
          path: _output/pa1.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Prepare browser preview
        shell: bash
        run: |
          mkdir -p _preview
          cp _output/pa1.pdf _preview/pa1.pdf

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            review_link=""
            if [[ "${{ steps.review.outputs.available }}" == "true" ]]; then
              cp _output/pa1-review.pdf _preview/pa1-review.pdf
              cp .review/manifest.json _preview/review-manifest.json
              review_link='<li><a href="pa1-review.pdf">Review PDF</a> - the paper with this pull request'"'"'s changes marked as a diff.</li>'
            fi
            cat > _preview/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>PA1 PDF preview</title>
              <style>
                body { font: 16px/1.5 system-ui, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 20px; }
                a { font-weight: 650; }
                li { margin: 10px 0; }
              </style>
            </head>
            <body>
              <h1>PA1 paper preview</h1>
              <ul>
                <li><a href="pa1.pdf">Normal PDF</a> - clean paper output.</li>
                ${review_link}
              </ul>
              <p>
                In the review PDF, green highlights mark added text and red strike-through
                removed text; blue and purple mark the same for the latest commit. A bar in
                the left margin spans each changed block, and changed or new figures are framed.
                Page 4 lists every change with a link to its page.
              </p>
            </body>
          </html>
          EOF
          else
            cat > _preview/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=pa1.pdf">
              <title>PA1 PDF preview</title>
            </head>
            <body>
              <p><a href="pa1.pdf">Open the rendered PA1 PDF.</a></p>
            </body>
          </html>
          EOF
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: >-
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
          env.CLOUDFLARE_API_TOKEN != '' &&
          env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          preCommands: >-
            wrangler pages project create ${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --production-branch=main || true
          command: >-
            pages deploy _preview
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ steps.preview.outputs.branch }}
            --commit-hash=${{ steps.preview.outputs.commit }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          REVIEW_AVAILABLE: ${{ steps.review.outputs.available }}
          REVIEW_CHANGES: ${{ steps.review.outputs.changes }}
          REVIEW_LATEST: ${{ steps.review.outputs.latest }}
          REVIEW_FIGURES: ${{ steps.review.outputs.figures }}
          REVIEW_PREV: ${{ steps.review.outputs.prev }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-pdf-preview -->';
            const preview = process.env.PREVIEW_URL.replace(/\/$/, '');
            const links = [`- [Normal PDF](${preview}/pa1.pdf)`];
            let note;
            if (process.env.REVIEW_AVAILABLE === 'true') {
              links.push(`- [Review PDF with the changes marked](${preview}/pa1-review.pdf)`);
              const latest = process.env.REVIEW_PREV
                ? `${process.env.REVIEW_LATEST} of them touched by the latest commit`
                : 'all from the latest commit, as this PR has a single commit';
              const summary = process.env.REVIEW_CHANGES === '0'
                ? 'Review PDF: this PR does not change the rendered paper. '
                : `Review PDF: ${process.env.REVIEW_CHANGES} changed block(s), ${latest}; ` +
                  `${process.env.REVIEW_FIGURES} new or changed figure(s). `;
              note =
                summary +
                'Green/red mark text added/removed in this PR, blue/purple the same for the latest commit. ' +
                'A margin bar spans each changed block and changed figures are framed. ' +
                'The page after the table of contents lists every change with its page.';
            } else {
              note = 'The review PDF could not be built for this run; see the workflow log.';
            }
            links.push(`- [Preview landing page](${preview}/)`);

            const body = [marker, '**Paper previews**', '', ...links, '', note].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
